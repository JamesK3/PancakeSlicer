services:
  pancakeslicer:
    image: zimengxiong/pancakeslicer:<pinned-version>   # or @sha256:...
    container_name: pancakeslicer
    restart: unless-stopped
    ports:
      - "127.0.0.1:6868:6868"     # or your host's LAN IP, e.g. "192.168.1.50:6868:6868"
    environment:
      ORCA_WEB_MAX_JOBS: "2"
      ORCA_WEB_PRINTER_NETWORK: "192.168.1.60,192.168.1.61"   # just your printers
      PANCAKE_STAGE_CACHE_MAX_MB: "1024"
      ORCA_WEB_BEARER_TOKEN: ${PANCAKE_TOKEN}                 # set in .env
    volumes:
      - pancakeslicer-data:/data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 8g
    pids_limit: 512
